name: EDINET backfill

# Downloads raw annual reports for a date range and returns them as an
# artifact, so a local store can import them without the API key.
on:
  workflow_dispatch:
    inputs:
      from_date:
        description: First filing date (YYYY-MM-DD)
        required: true
        type: string
      to_date:
        description: Last filing date (YYYY-MM-DD)
        required: true
        type: string

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --requirement api/requirements.txt

      - name: Download annual reports
        working-directory: api
        env:
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
        run: python -m screener.sources.edinet "$FROM_DATE" "$TO_DATE"

      - name: Upload raw filings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: edinet-raw-${{ inputs.from_date }}-${{ inputs.to_date }}
          path: ~/.cache/graham-screener/edinet
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
